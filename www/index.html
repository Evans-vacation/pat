<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>내 펫 키우기</title>
<style>
:root{--bg:#fff4e0;--card:#fff;--ink:#4a3424;--mut:#9a8068;--bar:#ffd9a8;--fill:#ff9f43;--btn:#ffe3b8;--sky:#cfeeff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#241a12;--card:#33261b;--ink:#f6e6d2;--mut:#b99d82;--bar:#4a3827;--fill:#ff9f43;--btn:#4a3827;--sky:#2b3d4f}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#241a12;--card:#33261b;--ink:#f6e6d2;--mut:#b99d82;--bar:#4a3827;--fill:#ff9f43;--btn:#4a3827;--sky:#2b3d4f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;display:flex;justify-content:center}
.app{width:100%;max-width:420px;padding:14px;display:flex;flex-direction:column;gap:12px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px}
input{font:inherit;font-weight:700;font-size:18px;border:0;background:transparent;color:var(--ink);width:6.5em;border-bottom:2px dashed var(--bar)}
.age{color:var(--mut);font-size:12px;flex:1}
.pick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.chip{border:2px solid transparent;background:var(--btn);border-radius:14px;padding:6px 0;font:inherit;font-size:12px;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:2px}
.chip b{font-size:22px;font-weight:400}
.chip.on{border-color:var(--fill);background:var(--card)}
.stage{background:var(--sky);border-radius:24px;height:260px;position:relative;overflow:hidden;transition:background .6s}
svg.scene{left:0;bottom:0;transform:none;width:100%;height:100%;cursor:default;pointer-events:none}
@keyframes spin{to{transform:rotate(360deg)}}
svg{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);width:210px;cursor:pointer}
.nightov{position:absolute;inset:0;background:rgba(10,20,60,.5);pointer-events:none;z-index:1;font-size:28px;text-align:right;padding:10px 16px}
.bob{animation:bob 1.6s ease-in-out infinite}
.sleepy{animation:none}
.hop{animation:hop .36s ease-in-out infinite}
@keyframes hop{50%{transform:translateX(-50%) translateY(-11px)}}
@keyframes fly{0%,100%{transform:translate(0,0)}25%{transform:translate(22px,-16px)}50%{transform:translate(48px,4px)}75%{transform:translate(20px,16px)}}
@keyframes blink{0%,100%{opacity:.1}50%{opacity:1}}
@keyframes cross{from{transform:translateX(-40px)}to{transform:translateX(440px)}}
@keyframes rain{from{transform:translateY(-30px)}to{transform:translateY(30px)}}
@keyframes snow{from{transform:translate(0,-10px)}to{transform:translate(16px,270px)}}
@keyframes flash{0%,91%,100%{opacity:0}92%{opacity:.65}93%{opacity:0}94.5%{opacity:.4}96%{opacity:0}}
@keyframes drift{from{transform:translateX(-34px)}to{transform:translateX(34px)}}
.wxc{position:absolute;right:8px;bottom:6px;z-index:2;border:0;background:rgba(255,255,255,.72);border-radius:12px;padding:3px 9px;font:inherit;font-size:11px;color:#444}
svg#bed{left:70%;bottom:8px;width:190px;pointer-events:none;cursor:default}
.hand{position:absolute;z-index:3;pointer-events:none;width:46px;height:50px;opacity:0}
.hand svg{position:static;transform:rotate(165deg);width:100%;height:100%;cursor:default}
.hand.p{animation:hpat 1s ease-in-out forwards}
.hand.t{animation:htk .95s ease-in-out forwards}
@keyframes hpat{0%{opacity:0;transform:translate(-50%,-110%)}12%{opacity:1;transform:translate(-50%,-80%)}30%{transform:translate(-100%,-78%) rotate(-10deg)}50%{transform:translate(0%,-78%) rotate(10deg)}70%{transform:translate(-100%,-78%) rotate(-10deg)}88%{opacity:1;transform:translate(-50%,-80%)}100%{opacity:0;transform:translate(-50%,-110%)}}
@keyframes htk{0%{opacity:0;transform:translate(-50%,-90%)}12%{opacity:1;transform:translate(-50%,-60%)}25%{transform:translate(-64%,-66%) rotate(-14deg)}40%{transform:translate(-36%,-56%) rotate(14deg)}55%{transform:translate(-64%,-66%) rotate(-14deg)}70%{transform:translate(-36%,-56%) rotate(14deg)}88%{opacity:1}100%{opacity:0;transform:translate(-50%,-90%)}}
svg#chr{transform-origin:50% 100%}
.pat{animation:nod .7s ease-in-out}
.tickle{animation:jig .3s ease-in-out 3}
@keyframes nod{0%,100%{transform:translateX(-50%) scale(1,1)}25%{transform:translateX(-50%) scale(1.05,.93)}55%{transform:translateX(-50%) scale(.97,1.04)}80%{transform:translateX(-50%) scale(1.02,.98)}}
@keyframes jig{0%,100%{transform:translateX(-50%) rotate(0)}25%{transform:translateX(-50%) rotate(-9deg) translateY(-4px)}75%{transform:translateX(-50%) rotate(9deg) translateY(-4px)}}
@keyframes bob{50%{transform:translateX(-50%) translateY(-6px)}}
@keyframes wag{from{transform:rotate(-14deg)}to{transform:rotate(14deg)}}
@keyframes wob{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
.poop{position:absolute;bottom:14px;font-size:30px;cursor:pointer;border:0;background:none;z-index:2}
.fx{position:absolute;font-size:26px;pointer-events:none;animation:up 1.1s forwards;z-index:2}
@keyframes up{to{transform:translateY(-70px);opacity:0}}
.msg{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:var(--card);padding:6px 12px;border-radius:14px;font-size:13px;white-space:nowrap;z-index:2}
.badge{position:absolute;top:48px;left:14px;font-size:26px;display:flex;gap:4px;z-index:2}
.stats{background:var(--card);border-radius:20px;padding:12px 14px;display:grid;gap:8px}
.row{display:grid;grid-template-columns:92px 1fr;align-items:center;font-size:13px;gap:8px}
.row span:first-child{white-space:nowrap}
.bar{height:10px;background:var(--bar);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--fill);border-radius:6px;transition:width .4s}
.btns{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
button.a{background:var(--btn);border:0;border-radius:16px;padding:12px 0;font:inherit;font-size:13px;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:4px}
button.a b{font-size:24px;font-weight:400}
button.a:active{transform:scale(.95)}
button.wide{width:100%;flex-direction:row;justify-content:center;font-size:15px}
.snd{border:0;background:var(--btn);border-radius:50%;width:38px;height:38px;font-size:18px;color:var(--ink)}
.tiny{text-align:center;font-size:11px;color:var(--mut)}
.game{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:20px;z-index:10}
.gbox{background:var(--card);border-radius:24px;padding:20px;width:100%;max-width:340px;text-align:center;display:grid;gap:14px}
.gtxt{min-height:96px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:16px;font-weight:700;margin-bottom:12px}
.gtxt small{font-size:12px;font-weight:400;color:var(--mut)}
.gbtn{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gl{display:grid;gap:8px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid.c4{grid-template-columns:repeat(4,1fr)}
.cell{font-size:28px;padding:10px 0;border:0;border-radius:14px;background:var(--btn);color:var(--ink)}
.wallet{display:flex;gap:8px;align-items:center}
.coin{background:var(--card);border-radius:16px;padding:12px 14px;font-weight:700;font-size:15px;white-space:nowrap}
.wallet button.wide{flex:1;width:auto;padding:12px 0}
svg.prev{position:static;transform:none;width:150px;height:auto;margin:0 auto;display:block;cursor:default}
.coinline{text-align:center;font-weight:700;font-size:14px;margin-bottom:10px}
.sbody{max-height:46vh;overflow:auto;display:grid;gap:8px;text-align:left}
.sh{font-size:12px;color:var(--mut);margin-top:6px}
.item{display:flex;align-items:center;gap:10px;background:var(--btn);border-radius:14px;padding:8px 12px}
.ie{font-size:24px}
.in{flex:1;font-size:14px}
.mini{border:0;border-radius:12px;padding:8px 12px;font:inherit;font-size:13px;background:var(--card);color:var(--ink)}
.mini.on,.mini.buy{background:var(--fill);color:#fff}
.smsg{min-height:18px;text-align:center;font-size:12px;color:var(--mut)}
#splash{position:fixed;inset:0;z-index:99;background:linear-gradient(#ffe8f0,#fff4e0 60%,#ffe3b8);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;transition:opacity .5s;color:#4a3424;text-align:center}
#splash.out{opacity:0;pointer-events:none}
#splash .pets{display:flex;gap:10px;font-size:46px}
#splash .pets span{display:inline-block;animation:sjump .9s ease-in-out infinite}
#splash .pets span:nth-child(2){animation-delay:.12s}#splash .pets span:nth-child(3){animation-delay:.24s}#splash .pets span:nth-child(4){animation-delay:.36s}
@keyframes sjump{0%,100%{transform:translateY(0)}40%{transform:translateY(-22px) rotate(-6deg)}}
#splash h1{margin:6px 0 0;font-size:30px;letter-spacing:1px}
#splash .ld{width:200px;height:10px;background:rgba(255,159,67,.25);border-radius:6px;overflow:hidden;margin-top:8px}
#splash .ld i{display:block;height:100%;width:0;background:#ff9f43;border-radius:6px;animation:sload 3s linear forwards}
@keyframes sload{to{width:100%}}
#splash small{font-size:13px;opacity:.7}
</style></head><body>
<div id="splash"><div class="pets"><span>🐶</span><span>🐱</span><span>🐰</span><span>🐹</span></div><h1>내 펫 키우기</h1><div class="ld"><i></i></div><small>불러오는 중...</small><small id="ver"></small></div>
<div class="app">
<header><input id="name" maxlength="8" aria-label="이름"><span class="age" id="age"></span><button class="snd" id="snd" onclick="toggleBgm()" aria-label="소리">🔇</button></header>
<div class="pick" id="pick"></div>
<div class="stage" id="stage"><svg class="scene" id="scene" viewBox="0 0 400 260" preserveAspectRatio="xMidYMid slice"></svg><div class="msg" id="msg"></div><div class="badge" id="badge"></div><button class="wxc" id="wx" onclick="wxCycle()"></button>
<svg id="bed" viewBox="0 0 200 90" style="display:none"></svg><svg id="chr" viewBox="0 0 200 190" onclick="pet(event)"></svg><div class="nightov" id="nightov" hidden>🌙</div></div>
<div class="wallet"><div class="coin" id="coin"></div><button class="a wide" onclick="shopOpen()">🛍️ 코인샵 · 옷장</button></div>
<div class="stats" id="stats"></div>
<button class="a wide" id="again" hidden onclick="again()">🥚 새 알 받기</button>
<div class="btns">
<button class="a" id="fbtn" onclick="feed()"></button>
<button class="a" onclick="snack()"><b>🍬</b>간식</button>
<button class="a" id="pbtn" onclick="play()"></button>
<button class="a" onclick="gstart()"><b>🎮</b>게임</button>
<button class="a" onclick="wash()"><b>🛁</b>씻기기</button>
<button class="a" id="sbtn" onclick="sleep()"></button>
<button class="a" onclick="medicine()"><b>💊</b>약</button>
<button class="a" onclick="scold()"><b>😠</b>혼내기</button>
</div>
<div class="tiny" id="dex"></div>
<div class="tiny">밤(22시~7시)에는 불을 꺼서 재워 주세요. 부르면 빨리 달려가 주세요! 📢</div>
</div>
<div class="game" id="game" hidden><div class="gbox">
<div id="gbody"></div>
<button class="a wide" onclick="gend()">닫기</button>
</div></div>
<div class="game" id="shop" hidden><div class="gbox">
<div id="sprev"></div>
<div class="sbody" id="sbody"></div>
<div class="smsg" id="smsg"></div>
<button class="a wide" onclick="shopClose()">닫기</button>
</div></div>
<script>
var KEY="mongi-v2",R,S,G={},LIFE=10;
var STG=["알","아기","어린이","청소년","어른"],SCL=[.8,.62,.78,.9,1];
var FORM={good:{l:"모범생",i:"✨"},chubby:{l:"뚱보",i:"🍩"},bad:{l:"개구쟁이",i:"😈"},normal:{l:"보통",i:"🎀"}};
var SPC={
dog:{n:"몽이",e:"🐶",l:"강아지",f:"🍖",p:"🎾",s:"멍멍!"},
cat:{n:"나비",e:"🐱",l:"고양이",f:"🐟",p:"🧶",s:"야옹~"},
rabbit:{n:"토순이",e:"🐰",l:"토끼",f:"🥕",p:"🌼",s:"깡충!"},
hamster:{n:"햄톨",e:"🐹",l:"햄스터",f:"🌻",p:"🎡",s:"찍찍!"}};
function cs(){return SPC[R.cur]}
function isNight(){var h=new Date().getHours();return h>=22||h<7}
function stageOf(p){var a=(Date.now()-p.born)/60000;return a<.5?0:a<180?1:a<1440?2:a<4320?3:4}
function formOf(p){if(p.weight>=75)return"chubby";if(p.disc>=70&&p.cm<=2)return"good";if(p.disc<35||p.cm>=6)return"bad";return"normal"}
function mk(k){return{name:SPC[k].n,hunger:80,happy:80,energy:80,clean:80,born:Date.now(),last:Date.now(),sleeping:false,poop:0,weight:50,sick:false,disc:50,naughty:false,nT:0,neglect:0,dead:false,stg:0,old:false,cm:0,call:null,callT:0,form:null,gen:1,eq:{}}}
function fix(p){var d={weight:50,sick:false,disc:50,naughty:false,nT:0,neglect:0,dead:false,old:false,cm:0,call:null,callT:0,form:null,gen:1};for(var k in d)if(p[k]==null)p[k]=d[k];if(!p.eq)p.eq={};if(p.stg==null)p.stg=stageOf(p);if(p.stg===4&&!p.form)p.form=formOf(p)}
function load(){var r=null;try{r=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!r||!r.pets||!SPC[r.cur]){r={cur:"dog",pets:{}};try{var o=JSON.parse(localStorage.getItem("mongi-v1"));if(o&&typeof o.hunger==="number")r.pets.dog=o}catch(e){}}
if(!r.pets[r.cur])r.pets[r.cur]=mk(r.cur);
if(!r.dex)r.dex={};
Object.keys(r.pets).forEach(function(k){fix(r.pets[k])});R=r;S=R.pets[R.cur];
if(!R.inv)R.inv={};
if(R.coins==null){R.coins=100;R.inv.bandana=1;S.eq.neck="bandana";R.gift=true;R.day=dayKey(0);R.streak=1}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(R))}catch(e){}}
var cl=function(v){return Math.max(0,Math.min(100,v))};
function callOk(){return S.call=="hunger"?S.hunger>=25:S.call=="happy"?S.happy>=25:(S.sleeping||!isNight())}
function updateCall(min){
if(S.call&&callOk()){if(S.callT<=5&&S.call!="sleep"&&Date.now()-(R.lcr||0)>600000){R.lcr=Date.now();earn(5)}S.call=null;S.callT=0}
var fresh=false;
if(!S.call&&!S.sleeping){var nc=S.hunger<25?"hunger":S.happy<25?"happy":isNight()?"sleep":null;if(nc){S.call=nc;S.callT=Math.max(0,min-20);fresh=true;ring();lastCry=Date.now();var cv=nc=="hunger"?"hungry":nc=="happy"?"want":"sleepy";setTimeout(function(){sfx(cv)},350)}}
if(S.call&&!fresh)S.callT+=min;
if(S.call){var n=Math.floor(S.callT/15);if(n>0){S.cm+=Math.min(n,2);S.callT-=n*15;say("투정이 심해요...")}}}
function step(min){
var h=S.sleeping?.5:1,ngt=isNight()&&!S.sleeping;
S.hunger=cl(S.hunger-1.2*h*min);
S.happy=cl(S.happy-.8*min*(S.hunger<20?2:1)-(S.sick?.6*min:0)-(ngt?.3*min:0));
S.clean=cl(S.clean-(.6+S.poop*.5)*min);
S.energy=cl(S.energy+(S.sleeping?4*(S.eq&&S.eq.bed?ITEMS[S.eq.bed].m:1):-.5)*min);
S.weight=Math.max(20,S.weight-.03*min);
var p=0;if(S.clean<20)p+=.02;if(S.hunger<10)p+=.02;if(S.weight>90)p+=.02;if(S.poop>=3)p+=.02;
if(!S.sick&&p&&Math.random()<Math.min(1,p*min)){S.sick=true;sfx("sick");say("으으... 아파요")}
if(S.hunger<=0||S.sick)S.neglect+=min;else S.neglect=Math.max(0,S.neglect-.5*min);
if(S.neglect>=300){S.dead=true;S.old=false;S.sleeping=false;S.naughty=false;S.call=null;say("하늘나라로 떠났어요...");return}
if(S.sleeping&&S.energy>=100&&!isNight()){S.sleeping=false;say("잘 잤다! "+cs().s)}
updateCall(min)}
function tick(){var n=Date.now(),m=Math.min((n-S.last)/60000,240);
if((n-S.last)/60000>5)S.naughty=false;
S.last=n;
if(!S.dead&&S.stg>0)step(m);
if(!S.dead){
var s=stageOf(S);
if(s!==S.stg){var was=S.stg,bn=({1:10,2:20,3:30,4:50})[s]||0;S.stg=s;sfx("level");
if(s===4){S.form=formOf(S);var dk=R.cur+":"+S.form;if(!R.dex[dk])bn+=30;R.dex[dk]=1;R.coins+=bn;say("진화했어요! "+FORM[S.form].l+" "+FORM[S.form].i+" +"+bn+"🪙");fx("🌟")}
else{R.coins+=bn;say((was===0?"부화했어요! 🐣":"쑥쑥 자랐어요! 🎉")+" +"+bn+"🪙");fx(was===0?"🐣":"🎉")}}
if((n-S.born)/86400000>=LIFE){S.dead=true;S.old=true;S.sleeping=false;S.naughty=false;S.call=null;say("편안히 하늘나라로 떠났어요 🕊️")}
else{
if(S.stg>=2&&!S.sleeping&&!S.sick&&!S.naughty&&Math.random()<.004){S.naughty=true;S.nT=n;sfx("grumpy");say(["안 놀면 심술부릴 거야!","간식 줘!","싫어싫어!"][Math.floor(Math.random()*3)])}
if(S.naughty&&n-S.nT>120000){S.naughty=false;S.disc=cl(S.disc-15);say("제멋대로 굴었어요...")}}}
var cr=(!S.dead&&S.stg>0&&!S.sleeping)?(S.sick?"sick":S.call=="hunger"?"hungry":S.call=="happy"?"want":S.call=="sleep"?"sleepy":S.naughty?"grumpy":null):null;if(cr&&n-lastCry>22000){lastCry=n;sfx(cr)}
save();render()}
function mood(){if(S.sleeping)return"sleep";if(S.sick)return"sad";var lo=Math.min(S.hunger,S.happy,S.energy,S.clean);
if(lo<20)return"sad";if((S.hunger+S.happy+S.energy+S.clean)/4>70)return"happy";return"normal"}
function face(m,k){
var eyes,mouth,ex="";
if(m=="sleep"){eyes='<path d="M72 92q8 7 16 0M112 92q8 7 16 0" stroke="#4a3424" stroke-width="4" fill="none" stroke-linecap="round"/>';mouth='<path d="M92 118q8 5 16 0" stroke="#4a3424" stroke-width="3" fill="none" stroke-linecap="round"/>';ex='<text x="166" y="64" font-size="22">💤</text>'}
else if(m=="sad"){eyes='<circle cx="80" cy="92" r="7" fill="#4a3424"/><circle cx="120" cy="92" r="7" fill="#4a3424"/><circle cx="82" cy="89" r="2.5" fill="#fff"/><circle cx="122" cy="89" r="2.5" fill="#fff"/><path d="M68 78l16 5M132 78l-16 5" stroke="#4a3424" stroke-width="3" stroke-linecap="round"/>';mouth='<path d="M90 124q10-8 20 0" stroke="#4a3424" stroke-width="3" fill="none" stroke-linecap="round"/>';ex='<ellipse cx="68" cy="106" rx="3" ry="6" fill="#7ec8f5"/>'}
else if(m=="happy"){eyes='<path d="M70 96q10-14 20 0M110 96q10-14 20 0" stroke="#4a3424" stroke-width="4" fill="none" stroke-linecap="round"/>';mouth='<path d="M88 114q12 16 24 0z" fill="#e85d75" stroke="#4a3424" stroke-width="3" stroke-linejoin="round"/>';ex='<ellipse cx="62" cy="108" rx="9" ry="6" fill="#ffb3b3" opacity=".7"/><ellipse cx="138" cy="108" rx="9" ry="6" fill="#ffb3b3" opacity=".7"/>'}
else{eyes='<circle cx="80" cy="92" r="7" fill="#4a3424"/><circle cx="120" cy="92" r="7" fill="#4a3424"/><circle cx="82" cy="89" r="2.5" fill="#fff"/><circle cx="122" cy="89" r="2.5" fill="#fff"/>';mouth='<path d="M90 118q10 8 20 0" stroke="#4a3424" stroke-width="3" fill="none" stroke-linecap="round"/>'}
var nose={dog:'<ellipse cx="100" cy="106" rx="9" ry="6.5" fill="#4a3424"/>',
cat:'<path d="M94 103h12l-6 7z" fill="#ff8fa3"/>',
